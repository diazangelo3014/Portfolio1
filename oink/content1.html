<head>

    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
   <div class="site-main-wrapper">
             <button class="back">
            <a href="../index.html"> <img src="../images/back.svg"> </a>
        </button>

        <header>
            <div class="container">
                <nav id="main-nav" class="flex items-center justify-between">
                    <div class="left flex items-center">
                        <div class="branding">
                            <img src="../images/logo.png" alt="">
                        </div>
                        <div>
                            <a href="../index.html">Home</a>
                            <a href="../index.html#about">About</a>
                            <a href="../index.html#services">Services</a>
                            <a href="../index.html#work">Work</a>
                          
                        </div>
                    </div>
                    <div class="right">
                        <a href="../index.html#contact"><button class="btn btn-primary">Contact</button> </a>
                    </div>
                </nav>
            
        </header>
 <div class="container">
                <h1 class="section-heading"><span>Current</span> Works</h1>
                <p>
                Showcase the current work from Client</p>
<div class="container">
              <div class="image-container">
            <div class="image"><img src="../images/a.jpg" alt="Work A"></div>
            <div class="image"><img src="../images/b.jpg" alt="Work B"></div>
            <div class="image"><img src="../images/c.jpg" alt="Work C"></div>
            <div class="image"><img src="../images/d.jpg" alt="Work D"></div>
            <div class="image"><img src="../images/e.jpg" alt="Work E"></div>
        </div>

             <div class="popup-image">
                <span>&times;</span>
                 <img src=../images/1.jpeg alt="">
              
             </div>

   </div>


<script>
    document.querySelectorAll('.image-container img').forEach(image => {
        image.onclick = () => {
              document.querySelector('.popup-image').style.display = 'block';
             document.querySelector('.popup-image img').src = image.getAttribute('src');
        }
    });

    document.querySelector('.popup-image span').onclick = () => {
     document.querySelector('.popup-image').style.display = 'none';

    }



</script>

   <script type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="../js/app.js"></script>

   
</body>

</html>
